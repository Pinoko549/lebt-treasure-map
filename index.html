<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>座標進捗マップ</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--text:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#2563eb;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden} .app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto}
.top{background:#111827;color:#fff;padding:9px 11px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.title{font-size:16px;font-weight:800} .stats{font-size:11px;color:#d1d5db;text-align:right;line-height:1.3}
.filters{background:#fff;border-bottom:1px solid var(--line);padding:7px;display:flex;gap:6px;overflow:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none} .chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:13px}
.chip.active{background:#111827;color:#fff;border-color:#111827}
.mapWrap{position:relative;overflow:hidden;background:#fff;touch-action:none} #map{width:100%;height:100%;display:block}
.grid{stroke:#e5e7eb;stroke-width:1;vector-effect:non-scaling-stroke} .axis{fill:#9ca3af;font-size:18px;user-select:none}
.hit{fill:transparent;pointer-events:all} .dot{stroke:#374151;stroke-width:1.2;vector-effect:non-scaling-stroke}
.dot.done{fill:#9ca3af!important;stroke:#6b7280;opacity:.42} .dot.focus{stroke:#111827;stroke-width:4}
.controls{position:absolute;right:9px;bottom:9px;display:flex;flex-direction:column;gap:7px}
.ctrl{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.96);font-size:20px;box-shadow:0 2px 8px #0002}
.bottom{background:#fff;border-top:1px solid var(--line);padding:7px 8px calc(7px + var(--safe));display:grid;grid-template-columns:1fr auto;gap:7px}
.search{display:flex;gap:5px;min-width:0} input{min-width:0;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 11px;font-size:14px} .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.sheetBg,.nameBg{display:none;position:fixed;inset:0;z-index:40;background:#0006;align-items:flex-end}
.sheet{width:100%;background:#fff;border-radius:18px 18px 0 0;padding:15px 15px calc(15px + var(--safe));box-shadow:0 -12px 40px #0003}
.handle{width:42px;height:5px;border-radius:9px;background:#d1d5db;margin:0 auto 11px} .sheetTitle{font-size:20px;font-weight:800;margin-bottom:5px}
.sheetSub{font-size:13px;color:var(--muted);margin-bottom:13px;line-height:1.5} .actions{display:grid;grid-template-columns:1fr 1.5fr;gap:7px}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 11px;border-radius:999px;font-size:12px;display:none;z-index:15;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#ecfdf5;color:#047857} .offline{background:#fef2f2;color:#b91c1c}
.nameRow{display:flex;gap:7px} .nameRow input{flex:1} .meta{font-size:12px;color:var(--muted);margin-top:8px}
@media(min-width:900px){.app{max-width:1100px;margin:auto;box-shadow:0 0 30px #0002}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div><div class="title">座標進捗マップ</div><div style="font-size:10px;color:#9ca3af;margin-top:2px">PC：ホイールで拡大縮小 / スマホ：ピンチ操作</div></div>
      <span id="syncBadge" class="badge offline">未接続</span>
    </div>
    <div class="stats" id="stats">読み込み中</div>
  </div>
  <div class="filters" id="filters">
    <button class="chip active" data-kind="level" data-value="all">すべて</button>
    <button class="chip" data-kind="level" data-value="1">Lv1</button><button class="chip" data-kind="level" data-value="2">Lv2</button>
    <button class="chip" data-kind="level" data-value="3">Lv3</button><button class="chip" data-kind="level" data-value="4">Lv4</button>
    <button class="chip" data-kind="level" data-value="5">Lv5</button><button class="chip" data-kind="level" data-value="6">Lv6</button>
    <button class="chip" data-kind="level" data-value="7">Lv7</button>
    <button class="chip" data-kind="status" data-value="open">未完了</button><button class="chip" data-kind="status" data-value="done">完了</button>
  </div>
  <div class="mapWrap" id="wrap">
    <svg id="map" viewBox="0 0 1000 1000"><g id="viewport"></g></svg>
    <div class="controls"><button class="ctrl" id="zin">＋</button><button class="ctrl" id="zout">－</button><button class="ctrl" id="home">⌂</button></div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="bottom">
    <div class="search"><input id="coord" inputmode="numeric" placeholder="座標検索 例 214,247"><button class="btn" id="find">検索</button></div>
    <button class="btn" id="rename">名前</button>
  </div>
</div>

<div class="sheetBg" id="sheetBg"><div class="sheet">
  <div class="handle"></div><div class="sheetTitle" id="sheetTitle"></div><div class="sheetSub" id="sheetSub"></div>
  <div class="actions"><button class="btn" id="cancel">閉じる</button><button class="btn primary" id="complete">この座標を完了</button></div>
</div></div>

<div class="nameBg" id="nameBg"><div class="sheet">
  <div class="handle"></div><div class="sheetTitle">表示名</div>
  <div class="sheetSub">誰が完了したか分かるよう、ゲーム内の名前などを入力してください。この端末に保存されます。</div>
  <div class="nameRow"><input id="nameInput" maxlength="40" placeholder="例：ぴのこ"><button class="btn primary" id="saveName">保存</button></div>
  <div class="meta">個人情報ではなく、連盟内で識別できる名前の利用がおすすめです。</div>
</div></div>

function msg(t){toast.textContent=t;toast.style.display="block";clearTimeout(msg.t);msg.t=setTimeout(()=>toast.style.display="none",1900)}
function grid(){for(let i=0;i<=1000;i+=100){viewport.appendChild(E("line",{x1:i,y1:0,x2:i,y2:1000,class:"grid"}));viewport.appendChild(E("line",{x1:0,y1:i,x2:1000,y2:i,class:"grid"}));if(i<1000){let a=E("text",{x:i+6,y:22,class:"axis"});a.textContent=i;viewport.appendChild(a);let b=E("text",{x:6,y:i+22,class:"axis"});b.textContent=i;viewport.appendChild(b)}}}
function dots(){for(const p of POINTS){let g=E("g",{"data-id":p.id,"data-level":p.level}),d=E("circle",{cx:p.x,cy:p.y,r:7,fill:p.color,class:"dot"}),h=E("circle",{cx:p.x,cy:p.y,r:16,class:"hit"});h.addEventListener("pointerdown",e=>e.stopPropagation());
h.addEventListener("click",e=>{e.stopPropagation();const done=completed.get(p.id);if(done){msg(`完了済み：${done.completed_by}`);return} openSheet(p)});g.append(d,h);viewport.appendChild(g)}}
function refresh(){let done=completed.size,open=POINTS.length-done;document.querySelectorAll("#viewport>g[data-id]").forEach(g=>{let isDone=completed.has(g.dataset.id);g.querySelector(".dot").classList.toggle("done",isDone);let l=levelFilter==="all"||g.dataset.level===levelFilter;let s=statusFilter==="all"||(statusFilter==="done"&&isDone)||(statusFilter==="open"&&!isDone);g.style.display=l&&s?"":"none"});stats.textContent=`未完了 ${open} ｜ 完了 ${done} ｜ 全 ${POINTS.length}`}
function openSheet(p){selected=p;const done=completed.get(p.id);document.getElementById("sheetTitle").textContent=`Lv${p.level}　X:${p.x} Y:${p.y}`;document.getElementById("sheetSub").textContent=done?`完了：${done.completed_by}`:"この座標を完了にすると、全員の画面でグレー表示になります。";document.getElementById("complete").style.display=done?"none":"";sheetBg.style.display="flex"}
function closeSheet(){selected=null;sheetBg.style.display="none"}
function transform(){scale=Math.max(1,Math.min(8,scale));tx=Math.min(0,Math.max(1000-1000*scale,tx));ty=Math.min(0,Math.max(1000-1000*scale,ty));viewport.setAttribute("transform",`translate(${tx} ${ty}) scale(${scale})`)}
function zoom(f,cx=500,cy=500){let old=scale,ns=Math.max(1,Math.min(8,scale*f)),r=ns/old;tx=cx-(cx-tx)*r;ty=cy-(cy-ty)*r;scale=ns;transform()}
function requireName(){if(myName)return true;document.getElementById("nameInput").value="";nameBg.style.display="flex";return false}

const configured=!SUPABASE_URL.includes("PASTE_")&&!SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");
let supabase=null;
if(configured){
  supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
  const {data,error}=await supabase.from("coordinate_progress").select("*");
  if(error){badge.textContent="接続エラー";msg(error.message)}else{for(const r of data)completed.set(r.coord_id,r);badge.textContent="共有中";badge.classList.remove("offline");refresh()}
  supabase.channel("progress-live")
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"coordinate_progress"},payload=>{completed.set(payload.new.coord_id,payload.new);refresh();msg(`${payload.new.completed_by}さんが1件完了`)})
    .subscribe();
}else{badge.textContent="設定待ち";msg("Supabase設定を入れると共有版になります")}

document.getElementById("complete").onclick=async()=>{
  if(!selected||!configured)return msg("先にSupabase設定が必要です");
  if(!requireName())return;
  const p=selected;
  const {data,error}=await supabase.from("coordinate_progress").insert({coord_id:p.id,level:p.level,x:p.x,y:p.y,completed_by:myName}).select().single();
  if(error){if(error.code==="23505"){msg("別の人が先に完了しました");const {data:r}=await supabase.from("coordinate_progress").select("*").eq("coord_id",p.id).maybeSingle();if(r)completed.set(r.coord_id,r);refresh();closeSheet();return}msg(error.message);return}
  completed.set(data.coord_id,data);refresh();closeSheet();msg("完了しました");
};
document.getElementById("cancel").onclick=closeSheet;sheetBg.onclick=e=>{if(e.target===sheetBg)closeSheet()};

document.getElementById("saveName").onclick=()=>{let v=document.getElementById("nameInput").value.trim();if(!v)return msg("名前を入力してください");myName=v;localStorage.setItem("coord-map-name",v);nameBg.style.display="none";msg(`表示名：${v}`)};
document.getElementById("rename").onclick=()=>{document.getElementById("nameInput").value=myName;nameBg.style.display="flex"};
if(!myName)setTimeout(()=>nameBg.style.display="flex",300);

document.getElementById("filters").onclick=e=>{let b=e.target.closest(".chip");if(!b)return;if(b.dataset.kind==="level")levelFilter=b.dataset.value;else statusFilter=statusFilter===b.dataset.value?"all":b.dataset.value;document.querySelectorAll('.chip[data-kind="level"]').forEach(x=>x.classList.toggle("active",x.dataset.value===levelFilter));document.querySelectorAll('.chip[data-kind="status"]').forEach(x=>x.classList.toggle("active",x.dataset.value===statusFilter));refresh()};

wrap.addEventListener("pointerdown",e=>{
  if(e.target.closest && e.target.closest(".hit")) return;
  wrap.setPointerCapture(e.pointerId);
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx,ty};
});
wrap.addEventListener("pointermove",e=>{if(!drag||drag.id!==e.pointerId)return;let r=map.getBoundingClientRect();tx=drag.tx+(e.clientX-drag.x)/r.width*1000;ty=drag.ty+(e.clientY-drag.y)/r.height*1000;transform()});
wrap.addEventListener("pointerup",()=>drag=null);wrap.addEventListener("pointercancel",()=>drag=null);
document.getElementById("zin").onclick=()=>zoom(1.35);document.getElementById("zout").onclick=()=>zoom(.75);document.getElementById("home").onclick=()=>{scale=1;tx=0;ty=0;transform()};

map.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=map.getBoundingClientRect();
  const sx=(e.clientX-r.left)/r.width*1000;
  const sy=(e.clientY-r.top)/r.height*1000;
  zoom(e.deltaY<0?1.2:0.84,sx,sy);
},{passive:false});

map.addEventListener("dblclick",e=>{
  e.preventDefault();
  const r=map.getBoundingClientRect();
  const sx=(e.clientX-r.left)/r.width*1000;
  const sy=(e.clientY-r.top)/r.height*1000;
  zoom(1.5,sx,sy);
});


function findCoord(){let raw=document.getElementById("coord").value.trim(),m=raw.match(/(\d+)\D+(\d+)/);if(!m)return msg("例：214,247");let x=+m[1],y=+m[2],p=POINTS.find(q=>q.x===x&&q.y===y);if(!p)return msg("その座標はありません");levelFilter="all";statusFilter="all";refresh();scale=5;tx=500-x*scale;ty=500-y*scale;transform();let d=document.querySelector(`[data-id="${p.id}"] .dot`);d?.classList.add("focus");setTimeout(()=>d?.classList.remove("focus"),1600);let done=completed.get(p.id);msg(done?`完了済み：${done.completed_by}`:`Lv${p.level} X:${p.x} Y:${p.y}`)}
document.getElementById("find").onclick=findCoord;document.getElementById("coord").onkeydown=e=>{if(e.key==="Enter")findCoord()};

grid();dots();transform();refresh();
</script>
</body>
</html>
